[project]
name = "physical-intervene"
version = "0.1.0"
description = "Intervention test for learned world models: planar pushing in MuJoCo with exact counterfactual replay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "mujoco>=3.2",
]

[project.optional-dependencies]
models = [
    "torch>=2.4,<3",
]

[build-system]
requires = ["uv_build>=0.9,<0.15"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv.build-backend]
module-name = "physical_intervene"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E741"]
